name: ocr_translator_app
description: A Flutter app for OCR with multi-language support
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.6.0
  
  # Media Processing
  image_picker: ^1.0.4
  video_player: ^2.7.2
  file_picker: ^6.1.1
  path_provider: ^2.1.0
  
  # OCR
  google_ml_kit: ^0.16.0
  
  # Dictionary/Language
  http: ^1.1.0
  dio: ^5.3.3
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  
  # Utilities
  permission_handler: ^10.4.3
  device_info_plus: ^9.0.3
  connectivity_plus: ^5.0.1
  shared_preferences: ^2.2.2
  
  # Localization
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/