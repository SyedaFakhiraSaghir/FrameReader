name: ocr_translator_app
description: A Flutter app for OCR with multi-language support
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  web: ^1.1.1
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^9.2.1
  
  # Media Processing
  image_picker: ^1.0.4
  video_player: ^2.14.0
  file_picker: ^12.2.0
  path: ^1.9.1
  path_provider: ^2.1.0
  
  # OCR
  google_mlkit_text_recognition: ^0.17.1
  
  # Dictionary/Language
  http: ^1.1.0
  dio: ^5.3.3
  
  # UI Components
  flutter_svg: ^2.0.7
  cached_network_image: ^4.0.0
  
  # Utilities
  permission_handler: ^13.0.2
  device_info_plus: ^13.2.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.2.2
  
  # Localization
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/